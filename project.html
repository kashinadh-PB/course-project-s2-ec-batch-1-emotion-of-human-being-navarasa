<html>
  <head>
    <title>Navarasa - The Nine Emotions</title>
    <style>
      body {
        text-align: center;
        font-family: Arial, sans-serif;
        background-color: #7bf3b7;
      }
      .title {
        font-size: 36px;
        color: rgb(49, 12, 119);
        margin: 20px 0;
      }
      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
      }
      .rasa {
        width: 250px;
        background: white;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }
      .rasa:hover {
        transform: scale(1.25);
      }
      .rasa img {
        width: 100%;
        height: 180px;
        border-radius: 10px;
      }
      .rasa a {
        display: block;
        margin-top: 10px;
        font-size: 18px;
        text-decoration: none;
        color: darkblue;
        font-weight: bold;
      }
      .rasa a:hover {
        color: orange;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Navarasa - The Nine Emotions</h1>
    <div class="container">
      <div class="rasa">
        <img src="srik.jpeg" alt="Shringara Rasa" />
        <a href="Shringara.html" target="_blank" onclick="return checker(event)">Shringara Rasa</a>
      </div>

      <div class="rasa">
        <img src="hasya.jpeg" alt="Hasya Rasa" />
        <a href="Hasya.html" target="_blank" onclick="return checker(event)">Hasya Rasa</a>

        <img src="karuna.jpeg" alt="Karuna Rasa" />
        <a href="Karuna.html" target="_blank" onclick="return checker(event)">Karuna Rasa</a>
      </div>

      <div class="rasa">
        <img src="raudra.jpeg" alt="Raudra Rasa" />
        <a href="Raudra.html" target="_blank" onclick="return checker(event)">Raudra Rasa</a>
      </div>

      <div class="rasa">
        <img src="veera1.jpeg" alt="Veera Rasa" />

      </div>

      <div class="rasa">
        <img src="bhayanka.jpeg" alt="Bhayanaka Rasa" />

      </div>

      <div class="rasa">
        <img src="bibhatsa.jpeg" alt="Bibhatsa Rasa" />
        <a href="Bibhatsa.html" target="_blank" onclick="return checker(event)">Bibhatsa Rasa</a>
      </div>

      <div class="rasa">
        <img src="adbhuta.jpeg" alt="Adbhuta Rasa" />

      </div>

      <div class="rasa">
        <img src="shanta.jpeg" alt="Shanta Rasa" />

      </div>
    </div>

    <script>
      function checker(event) {
        var result = confirm('Are you sure you want to open this link?');
        if (!result) {
          event.preventDefault(); 
        }
      }
    </script>

</html>
